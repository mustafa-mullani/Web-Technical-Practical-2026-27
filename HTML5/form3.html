<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Input Types</title>
</head>
<body>

    <h2>HTML5 Input Types</h2>

    <form>

        Name:
        <input type="text" placeholder="Enter Name">
        <br><br>

        Email:
        <input type="email" placeholder="Enter Email">
        <br><br>

        Website:
        <input type="url" placeholder="Enter Website URL">
        <br><br>

        Age:
        <input type="number" min="18" max="60">
        <br><br>

        Date:
        <input type="date">
        <br><br>

        Time:
        <input type="time">
        <br><br>

        Color:
        <input type="color">
        <br><br>

        Range:
        <input type="range" min="0" max="100">
        <br><br>

        Month:
        <input type="month">
        <br><br>

        Week:
        <input type="week">
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
