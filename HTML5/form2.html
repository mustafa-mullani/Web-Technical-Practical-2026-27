<!DOCTYPE html>
<html>
<head>
    <title>Employee Details</title>
</head>
<body>

    <h2>Employee Details Form</h2>

    <form>

        Employee Name:
        <input type="text" name="ename" required>
        <br><br>

        Employee ID:
        <input type="number" name="eid" min="1" required>
        <br><br>

        Email:
        <input type="email" name="email">
        <br><br>

        Department:
        <select name="department">
            <option>IT</option>
            <option>HR</option>
            <option>Finance</option>
            <option>Marketing</option>
        </select>
        <br><br>

        Joining Date:
        <input type="date" name="joining">
        <br><br>

        Salary:
        <input type="number" name="salary" min="5000">
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
