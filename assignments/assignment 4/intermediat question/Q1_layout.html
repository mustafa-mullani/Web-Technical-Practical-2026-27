<!DOCTYPE html>
<html>
<head>
    <title>Complete Webpage Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #555;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        main {
            background-color: lightblue;
            padding: 20px;
            flex: 3;
        }

        aside {
            background-color: lightgray;
            padding: 20px;
            flex: 1;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="container">

        <main>
            <h2>Main Content</h2>
            <p>
                This is the main section of the webpage.
                It contains important website information.
            </p>
        </main>

        <aside>
            <h2>Sidebar</h2>
            <p>Related links and additional information.</p>
        </aside>

    </div>

    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
