<!DOCTYPE html>
<html>
<head>
    <title>SVG Rectangle</title>
</head>
<body>

    <h1>Rectangle Using SVG</h1>

    <svg width="300" height="200">

        <rect
            x="50"
            y="30"
            width="200"
            height="100"
            fill="skyblue"
            stroke="black"
            stroke-width="3"
        />

    </svg>

</body>
</html>
