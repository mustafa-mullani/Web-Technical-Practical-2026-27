<!DOCTYPE html>
<html>
<head>
    <title>Images with Captions</title>
</head>
<body>

    <h1>Beautiful Nature Gallery</h1>

    <figure>
        <img src="mountain.jpg" alt="   " width="300">
        <figcaption>Figure 1: Beautiful Mountain View</figcaption>
    </figure>

    <figure>
        <img src="waterfall.jpg" alt="Beautiful waterfall" width="300">
        <figcaption>Figure 2: Beautiful Waterfall</figcaption>
    </figure>

</body>
</html>
