<!DOCTYPE html>
<html>
<head>
    <title>SVG Circle</title>
</head>
<body>

    <h1>Circle Using SVG</h1>

    <svg width="300" height="200">

        <circle
            cx="150"
            cy="100"
            r="50"
            fill="lightgreen"
            stroke="black"
            stroke-width="3"
        />

    </svg>

</body>
</html>
