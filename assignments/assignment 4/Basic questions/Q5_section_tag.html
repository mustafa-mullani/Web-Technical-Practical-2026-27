
<!DOCTYPE html>
<html>
<head>
    <title>Section Element Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        h2 {
            color: #007bff;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <main>

        <!-- First Section -->
        <section>
            <h2>Technology</h2>
            <p>
                Technology makes our daily life easier.
                It includes computers, smartphones,
                artificial intelligence, and the internet.
            </p>
        </section>

        <!-- Second Section -->
        <section>
            <h2>Education</h2>
            <p>
                Education helps people gain knowledge
                and develop new skills. It plays an
                important role in personal and professional growth.
            </p>
        </section>

    </main>

</body>
</html>
