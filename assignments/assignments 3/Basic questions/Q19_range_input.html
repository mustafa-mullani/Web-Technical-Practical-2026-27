
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Control</title>
</head>
<body>

    <h2>Volume Control</h2>

    <form>
        <label for="volume">Select Volume Level:</label>

        <input
            type="range"
            id="volume"
            name="volume"
            min="1"
            max="100"
            value="50"
        >

        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
