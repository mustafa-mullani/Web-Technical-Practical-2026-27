
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthdate Form</title>
</head>
<body>

    <h2>Birthdate Form</h2>

    <form>
        <label for="birthdate">Select Your Birthdate:</label>

        <input
            type="date"
            id="birthdate"
            name="birthdate"
            required
        >

        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
