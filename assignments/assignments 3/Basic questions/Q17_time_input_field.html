
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Time Form</title>
</head>
<body>

    <h2>Appointment Booking Form</h2>

    <form>
        <label for="appointment">Select Appointment Time:</label>

        <input
            type="time"
            id="appointment"
            name="appointment"
            required
        >

        <br><br>

        <button type="submit">Book Appointment</button>
    </form>

</body>
</html>
