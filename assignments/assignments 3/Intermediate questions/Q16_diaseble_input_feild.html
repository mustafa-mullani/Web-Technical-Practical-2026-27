
<!DOCTYPE html>
<html>
<head>
    <title>Disabled and Readonly Input</title>
</head>
<body>

    <h2>Student Information Form</h2>

    <form>
        <label>Name:</label><br>
        <input type="text" name="name"
               placeholder="Enter your name">
        <br><br>

        <label>Email (Disabled):</label><br>
        <input type="email" name="email"
               value="student@gmail.com" disabled>
        <br><br>

        <label>Student ID (Readonly):</label><br>
        <input type="text" name="student_id"
               value="STU101" readonly>
        <br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
