
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Selection Form</title>
</head>
<body>

    <h2>Select Your Languages</h2>

    <form>

        <label>Select Languages:</label>

        <br><br>

        <input
            type="checkbox"
            id="english"
            name="languages"
            value="English"
        >
        <label for="english">English</label>

        <br><br>

        <input
            type="checkbox"
            id="hindi"
            name="languages"
            value="Hindi"
        >
        <label for="hindi">Hindi</label>

        <br><br>

        <input
            type="checkbox"
            id="french"
            name="languages"
            value="French"
        >
        <label for="french">French</label>

        <br><br>

        <input
            type="checkbox"
            id="spanish"
            name="languages"
            value="Spanish"
        >
        <label for="spanish">Spanish</label>

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
