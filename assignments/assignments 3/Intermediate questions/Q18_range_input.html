
<!DOCTYPE html>
<html>
<head>
    <title>Experience Rating Form</title>
</head>
<body>

    <h2>Rate Your Experience</h2>

    <form>
        <label for="rating">
            Rate your experience (1 to 10):
        </label>
        <br><br>

        <input type="range"
               id="rating"
               name="rating"
               min="1"
               max="10"
               value="5"
               oninput="ratingValue.innerHTML = this.value">

        <span id="ratingValue">5</span>

        <br><br>

        <input type="submit" value="Submit Rating">
    </form>

</body>
</html>
