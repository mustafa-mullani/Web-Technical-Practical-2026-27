
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF File Upload</title>
</head>
<body>

    <h2>Upload PDF File</h2>

    <form>

        <label for="pdf">Select PDF File:</label>

        <input
            type="file"
            id="pdf"
            name="pdf"
            accept=".pdf"
            required
        >

        <br><br>

        <button type="submit">Upload</button>

    </form>

</body>
</html>
