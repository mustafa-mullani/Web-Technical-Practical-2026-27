<!DOCTYPE html>
<html>
<head>
    <title>Start Attribute</title>
</head>
<body>

    <h2>Ordered List with Start</h2>

    <ol type="1" start="5">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ol>

    <ol type="A" start="3">
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
    </ol>

</body>
</html>
