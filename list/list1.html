<!DOCTYPE html>
<html>
<head>
    <title>Ordered List</title>
</head>
<body>

    <h2>Ordered List</h2>

    <ol type="1">
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
    </ol>

    <ol type="A">
        <li>Apple</li>
        <li>Mango</li>
        <li>Orange</li>
    </ol>

    <ol type="I">
        <li>Red</li>
        <li>Green</li>
        <li>Blue</li>
    </ol>

</body>
</html>
