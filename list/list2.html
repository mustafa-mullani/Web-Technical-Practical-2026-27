<!DOCTYPE html>
<html>
<head>
    <title>Unordered List</title>
</head>
<body>

    <h2>Unordered List</h2>

    <ul type="disc">
        <li>Java</li>
        <li>Python</li>
        <li>C++</li>
    </ul>

    <ul type="circle">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
    </ul>

    <ul type="square">
        <li>Red</li>
        <li>Green</li>
        <li>Blue</li>
    </ul>

</body>
</html>
