Here is a **simple beginner-friendly Login Page using HTML and CSS**. You can put both in **one file** and open it in your browser.

```html
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
        }

        .login {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="login">
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
```
